<section class="quote-section">
  <div class="quote-section__container">
    <div class="quote-card-full">
      <!-- Columna Izquierda -->
      <div class="quote-left">
        <h2 class="quote-card__title">¿Listo para tu próxima aventura?</h2>
        <p class="quote-card__subtitle">Déjanos tus datos y uno de nuestros expertos diseñará el viaje perfecto para ti.</p>
        
        <div class="contact-channels">
          <div class="channel-item"><span>📞</span> <div>Llámanos<br><strong>+52 (55) 55 55 55 55 55</strong></div></div>
          <div class="channel-item"><span>✉️</span> <div>Escríbenos<br><strong>hola@gtsviajes.com</strong></div></div>
          <div class="channel-item"><span>🟢</span> <div>WhatsApp<br><strong>+52 (55) 55 55 55 55 55</strong></div></div>
        </div>
      </div>

      <!-- Columna Derecha -->
  <form class="quote-right">
  <div class="form-grid">
    <div class="input-group"><label>Nombre completo</label><input type="text" placeholder="Ej. Juan Pérez"></div>
    <div class="input-group"><label>Correo electrónico</label><input type="email" placeholder="juan@ejemplo.com"></div>
    <div class="input-group"><label>Teléfono</label><input type="tel" placeholder="55 1234 5678"></div>
    <div class="input-group"><label>Destino de interés</label><input type="text" placeholder="Ej. París, Cancún..."></div>
    <div class="input-group"><label>Fecha aproximada</label><input type="text" placeholder="Ej. Diciembre 2024"></div>
    
<div class="input-group">
  <label>Presupuesto</label>

  <div class="custom-select" (click)="toggleDropdown($event)">
    <div class="select-styled">
      {{ selectedText }}
    </div>

    <ul class="select-options" *ngIf="isOpen">
  <li (click)="selectOption('Económico', $event)">Económico</li>
  <li (click)="selectOption('Estándar', $event)">Estándar</li>
  <li (click)="selectOption('Premium / Lujo', $event)">Premium / Lujo</li>
</ul>
  </div>
</div>
  </div>

  <div class="input-group full">
    <label>Mensaje adicional (Opcional)</label>
    <textarea placeholder="Cuéntanos más detalles sobre tu viaje ideal..."></textarea>
  </div>
  <button type="submit" class="submit-btn">Solicitar Cotización</button>
</form>
    </div>
  </div>
</section>
